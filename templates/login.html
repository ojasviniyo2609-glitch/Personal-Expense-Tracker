<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Personal Expense Tracker</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eef2ff,
                    #f8fafc
                );

            color: #1e293b;
        }


        .login-container {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }


        .login-card {
            background: white;

            padding: 40px 35px;

            border-radius: 20px;

            box-shadow:
                0 15px 40px
                rgba(15, 23, 42, 0.12);

            border:
                1px solid
                #e2e8f0;
        }


        .logo {
            width: 65px;
            height: 65px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 18px;

            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #7c3aed
                );

            color: white;

            font-size: 30px;
            font-weight: bold;

            box-shadow:
                0 8px 20px
                rgba(79, 70, 229, 0.25);
        }


        .title {
            text-align: center;

            font-size: 28px;

            margin: 0;

            color: #111827;
        }


        .subtitle {
            text-align: center;

            margin-top: 8px;
            margin-bottom: 30px;

            color: #64748b;

            font-size: 14px;
        }


        .form-group {
            margin-bottom: 20px;
        }


        label {
            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            font-weight: 600;

            color: #334155;
        }


        input {
            width: 100%;

            padding: 13px 14px;

            border:
                1px solid
                #cbd5e1;

            border-radius: 10px;

            font-size: 15px;

            outline: none;

            transition: 0.2s;
        }


        input:focus {
            border-color: #4f46e5;

            box-shadow:
                0 0 0 3px
                rgba(79, 70, 229, 0.12);
        }


        .password-wrapper {
            position: relative;
        }


        .password-wrapper input {
            padding-right: 75px;
        }


        .show-password {
            position: absolute;

            right: 12px;
            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: none;

            color: #4f46e5;

            font-size: 12px;

            font-weight: 600;

            cursor: pointer;
        }


        .login-button {
            width: 100%;

            padding: 14px;

            margin-top: 5px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #7c3aed
                );

            color: white;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }


        .login-button:hover {
            transform: translateY(-1px);

            box-shadow:
                0 8px 20px
                rgba(79, 70, 229, 0.25);
        }


        .login-button:active {
            transform: translateY(0);
        }


        #message {
            text-align: center;

            min-height: 20px;

            margin-top: 18px;

            font-size: 14px;

            color: #475569;
        }


        .register-text {
            text-align: center;

            margin-top: 25px;

            font-size: 14px;

            color: #64748b;
        }


        .register-text a {
            color: #4f46e5;

            font-weight: 600;

            text-decoration: none;
        }


        .register-text a:hover {
            text-decoration: underline;
        }


        .security-note {
            text-align: center;

            margin-top: 22px;

            font-size: 12px;

            color: #94a3b8;
        }


        @media (max-width: 480px) {

            .login-card {
                padding: 32px 24px;
            }

            .title {
                font-size: 24px;
            }

        }

    </style>

</head>


<body>


    <div class="login-container">

        <div class="login-card">


            <div class="logo">
                ₹
            </div>


            <h1 class="title">
                Personal Expense Tracker
            </h1>


            <p class="subtitle">
                Manage your expenses easily and securely.
            </p>


            <form id="loginForm">


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>


                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >


                        <button
                            type="button"
                            class="show-password"
                            id="showPassword"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <button
                    type="submit"
                    class="login-button"
                >
                    Login
                </button>


            </form>


            <p id="message"></p>


            <p class="register-text">

                Don't have an account?

                <a href="/register">
                    Create Account
                </a>

            </p>


            <p class="security-note">
                🔒 Your account and expenses are securely protected.
            </p>


        </div>

    </div>


    <script type="module">


        import { auth } from "/static/firebase.js";


        import {
            signInWithEmailAndPassword
        } from
        "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";


        const loginForm =
            document.getElementById("loginForm");


        const message =
            document.getElementById("message");


        const passwordInput =
            document.getElementById("password");


        const showPassword =
            document.getElementById("showPassword");


        showPassword.addEventListener(
            "click",
            () => {

                if (
                    passwordInput.type === "password"
                ) {

                    passwordInput.type = "text";

                    showPassword.textContent =
                        "Hide";

                } else {

                    passwordInput.type =
                        "password";

                    showPassword.textContent =
                        "Show";

                }

            }
        );


        loginForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const password =
                    passwordInput.value;


                message.textContent =
                    "Logging in...";


                try {


                    const userCredential =
                        await signInWithEmailAndPassword(
                            auth,
                            email,
                            password
                        );


                    const user =
                        userCredential.user;


                    const idToken =
                        await user.getIdToken();


                    const response =
                        await fetch(
                            "/sessionLogin",
                            {

                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        idToken:
                                            idToken
                                    })

                            }
                        );


                    const result =
                        await response.json();


                    if (
                        !response.ok ||
                        !result.success
                    ) {

                        throw new Error(
                            result.message ||
                            "Server login failed"
                        );

                    }


                    message.textContent =
                        "Login successful!";


                    setTimeout(
                        () => {

                            window.location.href =
                                "/";

                        },
                        500
                    );


                } catch (error) {

                    console.error(error);

                    message.textContent =
                        error.message;

                }

            }
        );


    </script>


</body>

</html>
